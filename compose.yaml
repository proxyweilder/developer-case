services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:-CaseDemo_2026!Sql}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  case1:
    build:
      context: .
      dockerfile: src/Case1.Api/Dockerfile
    environment:
      ConnectionStrings__Database: "Server=sql;Database=OrdersCase;User Id=sa;Password=${SQL_PASSWORD:-CaseDemo_2026!Sql};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "127.0.0.1:5081:8080"
    depends_on:
      sql:
        condition: service_healthy
  case2:
    build:
      context: .
      dockerfile: src/Case2.Api/Dockerfile
    environment:
      ConnectionStrings__Database: "Server=sql;Database=QuotesCase;User Id=sa;Password=${SQL_PASSWORD:-CaseDemo_2026!Sql};Encrypt=True;TrustServerCertificate=True"
      SeedDemoData: "true"
    ports:
      - "127.0.0.1:5082:8080"
    depends_on:
      sql:
        condition: service_healthy
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      SQL_TEST_CONNECTION: "Server=sql;Database=master;User Id=sa;Password=${SQL_PASSWORD:-CaseDemo_2026!Sql};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy
volumes:
  sql-data:
